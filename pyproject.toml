[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abiasales"
version = "0.2.0"
description = "A/B testing toolkit"
authors = [{ name = "Oleg Yaksin"}]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.22",
    "scipy>=1.9",
    "scikit-learn>=1.0",
    "tqdm",
    "statsmodels>=0.14"
]

[project.optional-dependencies]
# Styled tables in Jupyter
display = ["jinja2", "matplotlib", "ipython"]
# CUPAC variance reduction
cupac = ["catboost>=1.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["abiasales*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical calibration tests with many simulated experiments"]

[project.urls]
"Homepage" = "https://github.com/aviasales/ABiasales"
"Repository" = "https://github.com/aviasales/ABiasales"
